name: Embedded Swift

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # This is separate from the main pull request workflow because building this
  # package for Embedded Swift requires extra flags (a specific product and a
  # toolset) and an environment variable which, if passed there, would apply to
  # every other job too.
  embedded-wasm-sdk-build:
    name: Build
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.15
    with:
      enable_embedded_wasm_sdk_build: true
      wasm_sdk_versions: '["nightly-main"]'
      linux_os_versions: '["jammy"]'
      linux_env_vars: SWT_EMBEDDED=1
      swift_nightly_flags: --product EmbeddedShowcase --toolset Toolsets/Embedded.json
      enable_linux_checks: false
      enable_windows_checks: false
