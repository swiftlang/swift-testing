name: Pull request

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list-xcodes:
    name: List available Xcode versions
    runs-on: [self-hosted, macos]
    steps:
      - name: List available Xcode versions
        run: |
            ls -ld /Applications/*Xcode*
  tests:
    name: Test
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.17
    with:
      linux_swift_versions: '["nightly-main", "nightly-6.4.x"]'
      linux_os_versions: '["jammy"]'
      linux_static_sdk_versions: '["nightly-main", "nightly-6.4.x"]'
      windows_swift_versions: '["nightly-main", "nightly-6.4.x"]'
      enable_macos_checks: true
      macos_xcode_versions: '["swift_6.4"]'
      enable_ios_checks: true
      ios_host_xcode_versions: '["swift_6.4"]'
      enable_wasm_sdk_build: true
      wasm_sdk_versions: '["nightly-main", "nightly-6.4.x"]'
      enable_android_sdk_build: true
      android_ndk_versions: '["r28c", "r29"]'
      android_sdk_versions: '["nightly-main", "nightly-6.4.x"]'
      android_sdk_triples: '["aarch64-unknown-linux-android33", "x86_64-unknown-linux-android28"]'
      enable_android_sdk_checks: true
  # Building for Embedded Swift needs an environment variable and extra build
  # flags that must not apply to the other jobs, so it gets its own call to the
  # reusable workflow.
  build_embedded:
    name: Build
    uses: swiftlang/github-workflows/.github/workflows/swift_package_test.yml@0.0.17
    with:
      enable_linux_checks: false
      enable_windows_checks: false
      enable_embedded_wasm_sdk_build: true
      wasm_sdk_versions: '["nightly-main"]'
      linux_os_versions: '["jammy"]'
      linux_env_vars: SWT_EMBEDDED=1
      swift_nightly_flags: --product EmbeddedShowcase --toolset Toolsets/Embedded.json
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@0.0.17
    with:
      license_header_check_project_name: "Swift"
      docs_check_enabled: false
      format_check_enabled: false
      api_breakage_check_enabled: false
